const questions = [
  { q: "1. Where are transmission media located in relation to the Internet model?",

  { q: "2. Which layer is sometimes used to describe the position of transmission media?",

    correct: 1,
    explanation: "Because transmission media are located below the physical layer, it is often said that they belong to layer zero." },
  { q: "3. In what form are signals transmitted from one device to another through transmission media?",
    options: ["A) Acoustic waves", "B) Electromagnetic energy", "C) Mechanical vibrations", "D) Chemical signals"],
    correct: 1,
    explanation: "Signals propagate through transmission media in the form of electromagnetic energy." },
  { q: "4. What are the two broad categories into which transmission media can be classified?",

    explanation: "Transmission media are classified into two broad categories: guided (wired) and unguided (wireless)." },
  { q: "5. Which of the following defines guided media?",

    correct: 2,

  { q: "6. How is a signal contained when traveling along guided media?",

    explanation: "A signal traveling along guided media is directed and contained by the physical limits of the medium." },
  { q: "7. Which of the following is NOT an example of guided media?",

  { q: "8. What form of energy do twisted-pair and coaxial cables use to transport signals?",

    correct: 1,
    explanation: "Twisted-pair and coaxial cables use metallic (copper) conductors that accept and transport signals in the form of electric current." },
  { q: "9. What form of energy does an optical fiber use to transport signals?",

  { q: "10. How many conductors are typically found in a single twisted pair?",

    explanation: "A twisted pair consists of two conductors, normally made of copper." },
  { q: "11. What is the function of the two wires in a twisted-pair cable?",

    correct: 2,
    explanation: "One wire is used to carry signals to the receiver, and the other is used only as a ground reference." },
  { q: "12. How does the receiver utilize the two wires in a twisted-pair cable to determine the signal?",

    correct: 2,
    explanation: "The receiver uses the difference between the signal on one wire and the ground reference on the other." },
  { q: "13. Why are the two conductors in a twisted-pair cable twisted together?",
    options: ["A) To increase the physical strength of the cable", "B) To reduce the amount of copper used", "C) To ensure that interference (noise) and crosstalk affect both wires equally", "D) To allow the cable to bend more easily"],
    correct: 2,
    explanation: "Twisting ensures that interference and crosstalk affect both wires simultaneously and equally, allowing the receiver to cancel out the unwanted signals by measuring the difference." },
  { q: "14. What covers each conductor in a twisted-pair cable?",

  { q: "15. What are the most common types of twisted-pair cables used in communications?",

    correct: 0,
    explanation: "The most common twisted-pair cables are unshielded twisted-pair (UTP) and shielded twisted-pair (STP)." },
  { q: "16. What physical feature distinguishes STP cable from UTP cable?",

    correct: 1,
    explanation: "STP cable has a metal foil or braided-mesh covering that encases each pair of insulated conductors." },
  { q: "17. What is the primary advantage of the metal casing in STP cable?",

  { q: "18. What are the main disadvantages of STP compared to UTP?",

  { q: "19. According to the UTP categories, what is the maximum data rate for Category 1 cable, and what is its primary use?",

  { q: "20. Which category of UTP was originally used for T-1 lines and supports a data rate of 2 Mbps?",

  { q: "21. What is the typical use and data rate of Category 3 UTP cable?",

  { q: "22. Which UTP category provides a data rate of 20 Mbps and is associated with Token Ring networks?",

  { q: "23. What is the characteristic wire thickness of Category 5 UTP cable?",

  { q: "24. What is the data rate and typical use of Category 5 UTP cable?",

    correct: 2,

  { q: "25. What is the most common connector used for UTP cables?",

  { q: "26. What does the acronym \"RJ\" stand for in RJ45?",

    explanation: "RJ stands for registered jack." },
  { q: "27. How many pins are present in an RJ45 connector?",
    options: ["A) 4", "B) 6", "C) 8", "D) 10"],

  { q: "28. When evaluating the performance of twisted-pair cable, what happens to attenuation as frequency increases?",

    correct: 1,
    explanation: "With increasing frequency, attenuation sharply increases with frequencies above 100 kHz." },
  { q: "29. What unit is used to measure attenuation in cables?",

  { q: "30. In the context of cabling, what does \"gauge\" measure?",

    correct: 1,
    explanation: "Gauge is a measure of the thickness of the wire." },
  { q: "31. Based on the UTP performance chart, which gauge of wire has the lowest attenuation at a given frequency?",

    correct: 0,
    explanation: "The 18 gauge wire has the lowest attenuation curve compared to 22, 24, and 26 gauge wires." },
  { q: "32. How is the central core conductor of a coaxial cable constructed?",
    options: ["A) It uses a hollow glass tube", "B) It is composed of solid or stranded wire, usually copper", "C) It uses paired copper wires twisted together", "D) It relies on woven Kevlar threads"],
    correct: 1,
    explanation: "Coax has a central core conductor of solid or stranded wire (usually copper)." },
  { q: "33. In a coaxial cable, what encloses the central core conductor?",
    options: ["A) A metal foil shield", "B) A Kevlar jacket", "C) An insulating sheath/cover", "D) A secondary copper core"],
    correct: 2,
    explanation: "The central core is enclosed in an insulating sheath/cover." },
  { q: "34. What serves as the second conductor in a coaxial cable?",
    options: ["A) The inner copper wire", "B) The outer metallic wrapping", "C) The plastic cover", "D) The internal ground wire"],

    explanation: "The outer metallic wrapping serves as the second conductor, which completes the circuit." },
  { q: "35. Besides acting as the second conductor, what is the other primary function of the outer metallic wrapping in a coaxial cable?",
    options: ["A) It increases the speed of light", "B) It acts as a shield against noise", "C) It generates electric current", "D) It provides structural flexibility"],
    correct: 1,
    explanation: "The outer metallic wrapping serves both as a shield against noise and as the second conductor." },
  { q: "36. How are categories of coaxial cables rated?",
    options: ["A) By American Wire Gauge (AWG) numbers", "B) By their Radio Government (RG) ratings", "C) By Category (CAT) levels", "D) By Subminiature versions"],
    correct: 1,
    explanation: "Coaxial cables are categorized by their Radio Government (RG) ratings." },
  { q: "37. What physical specifications do RG numbers denote for coaxial cables?",

  { q: "38. What is the unit used to measure electrical impedance?",

    explanation: "Impedance is measured in Ohms." },
  { q: "39. What is the impedance and primary usage of RG-59 coaxial cable?",

  { q: "40. Which RG category of coaxial cable has an impedance of 50 Ω and is used for Thin Ethernet?",

  { q: "41. What is the usage of the RG-11 coaxial cable category?",

  { q: "42. What is the most common type of connector used today to connect coaxial cable to devices?",

  { q: "43. Which type of BNC connector is used to connect the end of the coaxial cable to a device, such as a TV set?",

  { q: "44. Which coaxial connector is used in Ethernet networks to branch out to a connection to a computer or other device?",

  { q: "45. What is the function of a BNC terminator?",

  { q: "46. How does the attenuation in coaxial cable compare to that in twisted-pair cable?",

  { q: "47. What is a consequence of the high attenuation in coaxial cables, despite having a higher bandwidth?",

  { q: "48. What materials are used to make fiber-optic cables?",

  { q: "49. What physical principle states that light travels in a straight line?",

  { q: "50. What happens if a ray of light traveling through one substance suddenly enters another substance of a different density?",

  { q: "51. What is the critical angle in relation to optical fibers?",

  { q: "52. In optical fiber, what phenomenon is used to guide light through the channel?",

  { q: "53. What is the relationship between the density of the core and the cladding in an optical fiber?",

  { q: "54. Why must the density of the cladding be less than that of the core?",

  { q: "55. What are the two main modes supported by current technology for propagating light along optical channels?",

  { q: "56. What are the subcategories of multimode propagation?",

  { q: "57. Why is multimode fiber so named?",

/* ============ Quiz Logic ============ */
const app = document.getElementById('app');
let currentIndex = 0;
let score = 0;
let userAnswers = questions.map(() => ({ selectedIndex: null, answered: false }));

function renderQuestion() {
  const q = questions[currentIndex];
  const total = questions.length;
  const state = userAnswers[currentIndex];

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${currentIndex + 1} of ${total}</span>
      <span class="progress">Score: ${score}</span>
    </div>
    <div class="question">${q.q}</div>
    <div class="options" id="options"></div>
    <div class="explanation ${state.answered ? '' : 'hidden'}" id="explanation">
      <strong>✅ Correct Answer:</strong> ${q.options[q.correct]}<br><br>
      <strong>💡 Explanation:</strong> ${q.explanation}
    </div>
    <div class="nav-buttons">
      <button class="navbtn prevbtn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="navbtn nextbtn" id="nextBtn" ${state.answered ? '' : 'disabled'}>
        ${currentIndex === total - 1 ? 'Show Results 🎯' : 'Next →'}
      </button>
    </div>
  `;

  const optionsBox = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;

    if (state.answered) {
      div.classList.add('locked');
      if (i === q.correct) {
        div.classList.add('correct');
      } else if (i === state.selectedIndex) {
        div.classList.add('wrong');
      }
    } else {
      div.onclick = () => selectOption(i, div);
    }
    optionsBox.appendChild(div);
  });

  document.getElementById('nextBtn').onclick = nextQuestion;
  document.getElementById('prevBtn').onclick = prevQuestion;
}

function selectOption(index, el) {
  const state = userAnswers[currentIndex];
  if (state.answered) return;

  state.answered = true;
  state.selectedIndex = index;
  const q = questions[currentIndex];
  const allOptions = document.querySelectorAll('.option');
  allOptions.forEach(o => o.classList.add('locked'));

  if (index === q.correct) {
    el.classList.add('correct');
    score++;
  } else {
    el.classList.add('wrong');
    allOptions[q.correct].classList.add('correct');
  }

  document.querySelector('.progress').textContent = `Score: ${score}`;
  document.getElementById('explanation').classList.remove('hidden');
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function showResults() {
  const total = questions.length;
  app.innerHTML = `
    <div class="final">
      <h2>🎉 Quiz Complete!</h2>
      <p>Your Score: <strong>${score}</strong> out of <strong>${total}</strong></p>
      <p>Percentage: ${Math.round((score / total) * 100)}%</p>
      <button class="restart" id="restartBtn">Restart Quiz ↻</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    currentIndex = 0;
    score = 0;
    userAnswers = questions.map(() => ({ selectedIndex: null, answered: false }));
    renderQuestion();
  };
}

renderQuestion();
</script>
